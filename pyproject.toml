[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "semantic-video-retriever"
version = "0.1.0"
description = "Timestamped semantic video search with pretrained CLIP"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "pillow>=10,<13", "imageio>=2.36,<3", "imageio-ffmpeg>=0.6,<1", "torch>=2.6,<3", "transformers>=4.57,<5"]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[project.scripts]
video-index = "src.models.train_model:main"
video-search = "src.models.predict_model:main"
video-moment-search = "src.models.moment_search:main"
video-demo-data = "src.data.make_dataset:main"
[tool.setuptools.packages.find]
include = ["src*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
