name: checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  source-and-evidence:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU software dependencies
        run: |
          python -m pip install torch==2.11.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]" nbformat==5.11.1
      - name: Compile source and check inference imports
        run: |
          python -m compileall -q src scripts evaluation_scripts
          python scripts/check_ci_imports.py
      - name: Run the full offline software test suite
        run: python -m pytest -q
      - name: Validate all six executed notebook artifacts
        run: python scripts/validate_notebooks.py
